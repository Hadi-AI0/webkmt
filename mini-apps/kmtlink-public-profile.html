<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bio-Link Profile</title>
    <link rel="icon" type="image/x-icon" href="../assets/favicon.ico">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: white;
            padding: 1rem;
            position: relative;
            overflow-x: hidden;
        }

        /* Animated background */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 50%, rgba(120, 119, 198, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(255, 119, 198, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 40% 80%, rgba(120, 200, 255, 0.1) 0%, transparent 50%);
            animation: floatingBg 20s ease-in-out infinite;
            pointer-events: none;
            z-index: -1;
        }

        @keyframes floatingBg {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            33% { transform: translate(30px, -30px) rotate(120deg); }
            66% { transform: translate(-20px, 20px) rotate(240deg); }
        }

        .container {
            max-width: 480px;
            margin: 2rem auto;
            position: relative;
            z-index: 1;
        }

        .profile-header {
            text-align: center;
            padding: 2rem;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 2rem;
        }

        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0 auto 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: bold;
            border: 3px solid rgba(255, 255, 255, 0.2);
        }

        .profile-name {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 0.5rem;
        }

        .profile-bio {
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.9rem;
            line-height: 1.5;
        }

        .links-container {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .link-item {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 1rem 1.5rem;
            text-decoration: none;
            color: white;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .link-item:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .link-icon {
            width: 24px;
            height: 24px;
            opacity: 0.8;
        }

        .link-content {
            flex: 1;
        }

        .link-title {
            font-weight: 600;
            margin-bottom: 0.25rem;
        }

        .link-description {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.7);
        }

        .footer {
            text-align: center;
            margin-top: 3rem;
            padding: 2rem;
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.8rem;
        }

        .footer a {
            color: #667eea;
            text-decoration: none;
        }

        .loading-state {
            text-align: center;
            padding: 4rem 2rem;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-state {
            text-align: center;
            padding: 4rem 2rem;
        }

        .error-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        /* Responsive design */
        @media (max-width: 640px) {
            .container {
                margin: 1rem auto;
            }
            
            .profile-header {
                padding: 1.5rem;
                margin-bottom: 1.5rem;
            }
            
            .avatar {
                width: 80px;
                height: 80px;
                font-size: 1.5rem;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- Loading State -->
        <div id="loadingState" class="loading-state">
            <div class="spinner"></div>
            <div>Loading profile...</div>
        </div>

        <!-- Profile Content -->
        <div id="profileContent" style="display: none;">
            <div class="profile-header">
                <div class="avatar" id="profileAvatar">👤</div>
                <div class="profile-name" id="profileName">Loading...</div>
                <div class="profile-bio" id="profileBio"></div>
            </div>

            <div class="links-container" id="linksContainer">
                <!-- Links will be populated here -->
            </div>
        </div>

        <!-- Error State -->
        <div id="errorState" class="error-state" style="display: none;">
            <div class="error-icon">🔍</div>
            <h2>Profile Not Found</h2>
            <p style="margin-top: 1rem; color: rgba(255,255,255,0.7);">
                This bio-link profile doesn't exist or has been disabled.
            </p>
        </div>

        <div class="footer">
            <p>Powered by <a href="https://webkmt.com" target="_blank">WebKMT</a></p>
        </div>
    </div>

    <!-- Supabase SDK -->
    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

        // Supabase configuration — injected by the dynamic config script
        const SUPABASE_URL = window.SUPABASE_URL || '';
        const SUPABASE_ANON_KEY = window.SUPABASE_ANON_KEY || '';

        let supabase = null;
        if (SUPABASE_URL && SUPABASE_ANON_KEY) {
            supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        }

        class PublicProfileViewer {
            constructor() {
                this.sb = supabase;
                this.username = this.getUsername();
                this.init();
            }

            getUsername() {
                // Get username from URL path (e.g., /username or ?username=value)
                const path = window.location.pathname;
                const urlParams = new URLSearchParams(window.location.search);
                
                return path.split('/').pop() || urlParams.get('username') || urlParams.get('u');
            }

            async init() {
                if (!this.username || !this.sb) {
                    this.showError();
                    return;
                }

                try {
                    await this.loadProfile();
                } catch (error) {
                    console.error('Error loading profile:', error);
                    this.showError();
                }
            }

            async loadProfile() {
                // Load public profile data by slug
                const { data: profileData, error: profileError } = await this.sb
                    .from('public_profiles')
                    .select('*')
                    .eq('slug', this.username)
                    .eq('is_active', true)
                    .single();

                if (profileError || !profileData) {
                    this.showError();
                    return;
                }

                // Update page title
                document.title = `${profileData.display_name || profileData.username} - Bio Link`;

                // Load user's active links
                const { data: links, error: linksError } = await this.sb
                    .from('kmt_links')
                    .select('*')
                    .eq('user_id', profileData.user_id)
                    .eq('active', true)
                    .order('sort_order', { ascending: true });

                this.profileUserId = profileData.user_id;
                this.renderProfile(profileData, links || []);
                this.incrementProfileView(profileData.user_id);
            }

            renderProfile(profileData, links) {
                // Update profile header
                const avatar = document.getElementById('profileAvatar');
                const name = document.getElementById('profileName');
                const bio = document.getElementById('profileBio');

                if (profileData.photo_url) {
                    avatar.innerHTML = `<img src="${profileData.photo_url}" alt="Avatar" style="width: 100%; height: 100%; border-radius: 50%; object-fit: cover;">`;
                } else {
                    avatar.textContent = (profileData.display_name || profileData.username || 'U')[0].toUpperCase();
                }

                name.textContent = profileData.display_name || profileData.username;
                
                if (profileData.bio) {
                    bio.textContent = profileData.bio;
                } else {
                    bio.style.display = 'none';
                }

                // Render links
                this.renderLinks(links);

                // Show profile content
                document.getElementById('loadingState').style.display = 'none';
                document.getElementById('profileContent').style.display = 'block';
            }

            renderLinks(links) {
                const container = document.getElementById('linksContainer');
                
                if (links.length === 0) {
                    container.innerHTML = `
                        <div style="text-align: center; padding: 2rem; color: rgba(255,255,255,0.6);">
                            <p>No links available</p>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = links.map(link => {
                    const icon = this.getLinkIcon(link.url);
                    return `
                        <a href="${link.url}" 
                           class="link-item" 
                           target="_blank" 
                           rel="noopener noreferrer"
                           onclick="window.publicProfileViewer.trackClick('${link.id}')">
                            <div class="link-icon">${icon}</div>
                            <div class="link-content">
                                <div class="link-title">${link.title}</div>
                                ${link.description ? `<div class="link-description">${link.description}</div>` : ''}
                            </div>
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="opacity: 0.5;">
                                <path d="M7 17L17 7M17 7H7M17 7V17"/>
                            </svg>
                        </a>
                    `;
                }).join('');
            }

            getLinkIcon(url) {
                const domain = new URL(url).hostname.toLowerCase();
                
                const iconMap = {
                    'twitter.com': '🐦',
                    'x.com': '✖️',
                    'instagram.com': '📷',
                    'linkedin.com': '💼',
                    'github.com': '👨‍💻',
                    'youtube.com': '📺',
                    'tiktok.com': '🎵',
                    'facebook.com': '📘',
                    'discord.com': '💬',
                    'spotify.com': '🎧',
                    'medium.com': '✍️',
                    'behance.net': '🎨',
                    'dribbble.com': '🏀'
                };

                return iconMap[domain] || '🔗';
            }

            async trackClick(linkId) {
                if (!linkId || !this.profileUserId) return;

                try {
                    // Increment click count on the link (uses RPC or direct update)
                    const { data: linkRow } = await this.sb
                        .from('kmt_links')
                        .select('clicks')
                        .eq('id', linkId)
                        .single();

                    if (linkRow) {
                        await this.sb
                            .from('kmt_links')
                            .update({ clicks: (linkRow.clicks || 0) + 1 })
                            .eq('id', linkId);
                    }

                    // Increment total clicks on user profile
                    const { data: profile } = await this.sb
                        .from('kmtlink_profiles')
                        .select('total_clicks')
                        .eq('user_id', this.profileUserId)
                        .single();

                    if (profile) {
                        await this.sb
                            .from('kmtlink_profiles')
                            .update({ total_clicks: (profile.total_clicks || 0) + 1 })
                            .eq('user_id', this.profileUserId);
                    }
                } catch (error) {
                    console.error('Error tracking click:', error);
                }
            }

            async incrementProfileView(userId) {
                try {
                    const { data: profile } = await this.sb
                        .from('kmtlink_profiles')
                        .select('total_views, profile_views')
                        .eq('user_id', userId)
                        .single();

                    if (profile) {
                        await this.sb
                            .from('kmtlink_profiles')
                            .update({
                                total_views: (profile.total_views || 0) + 1,
                                profile_views: (profile.profile_views || 0) + 1
                            })
                            .eq('user_id', userId);
                    }
                } catch (error) {
                    console.error('Error tracking profile view:', error);
                }
            }

            showError() {
                document.getElementById('loadingState').style.display = 'none';
                document.getElementById('errorState').style.display = 'block';
            }
        }

        // Initialize when DOM is ready
        document.addEventListener('DOMContentLoaded', () => {
            window.publicProfileViewer = new PublicProfileViewer();
        });
    </script>
</body>
</html>
