<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Palette Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 2rem;
            min-height: 100vh;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 2rem;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 2rem;
            font-size: 2rem;
        }

        .controls {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.3);
        }

        .palette {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
            margin: 2rem 0;
        }

        .color-card {
            background: white;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
            cursor: pointer;
        }

        .color-card:hover {
            transform: translateY(-5px);
        }

        .color-preview {
            height: 120px;
            width: 100%;
            position: relative;
        }

        .color-info {
            padding: 1rem;
        }

        .color-hex {
            font-family: 'Courier New', monospace;
            font-weight: bold;
            font-size: 1.1rem;
            color: #333;
            margin-bottom: 0.5rem;
        }

        .color-copy {
            font-size: 0.9rem;
            color: #666;
        }

        .copied {
            color: #4CAF50;
            font-weight: bold;
        }

        .export-section {
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px solid #eee;
        }

        .export-formats {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        @media (max-width: 768px) {
            .container {
                padding: 1rem;
                margin: 1rem;
            }
            
            .palette {
                grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            }
        }
    </style>
</head>



<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-KBFEXZKMWV"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}

  gtag('config', 'G-KBFEXZKMWV');

<body>
    <div class="container">
        <h1>🎨 Color Palette Generator</h1>
        
        <div class="controls">
            <button onclick="generateRandomPalette()">Generate Random</button>
            <button onclick="generateMonochromatic()">Monochromatic</button>
            <button onclick="generateComplementary()">Complementary</button>
            <button onclick="generateTriadic()">Triadic</button>
            <button onclick="generateAnalogous()">Analogous</button>
        </div>

        <div class="palette" id="palette"></div>

        <div class="export-section">
            <h3 style="text-align: center; margin-bottom: 1rem; color: #333;">Export Palette</h3>
            <div class="export-formats">
                <button onclick="exportPalette('css')">Export as CSS</button>
                <button onclick="exportPalette('json')">Export as JSON</button>
                <button onclick="exportPalette('adobe')">Export for Adobe</button>
            </div>
        </div>
    </div>

    <script>
        let currentPalette = [];

        function generateRandomPalette() {
            const colors = [];
            for (let i = 0; i < 5; i++) {
                colors.push(generateRandomColor());
            }
            displayPalette(colors);
        }

        function generateRandomColor() {
            return '#' + Math.floor(Math.random()*16777215).toString(16).padStart(6, '0');
        }

        function generateMonochromatic() {
            const baseColor = generateRandomColor();
            const hsl = hexToHsl(baseColor);
            const colors = [baseColor];
            
            for (let i = 1; i < 5; i++) {
                const newLightness = Math.max(0.1, Math.min(0.9, hsl.l + (i - 2) * 0.2));
                colors.push(hslToHex(hsl.h, hsl.s, newLightness));
            }
            
            displayPalette(colors);
        }

        function generateComplementary() {
            const baseColor = generateRandomColor();
            const hsl = hexToHsl(baseColor);
            const complementHue = (hsl.h + 180) % 360;
            
            const colors = [
                baseColor,
                hslToHex(complementHue, hsl.s, hsl.l),
                hslToHex(hsl.h, hsl.s * 0.7, hsl.l * 1.2),
                hslToHex(complementHue, hsl.s * 0.7, hsl.l * 1.2),
                hslToHex((hsl.h + 90) % 360, hsl.s * 0.8, hsl.l)
            ];
            
            displayPalette(colors);
        }

        function generateTriadic() {
            const baseColor = generateRandomColor();
            const hsl = hexToHsl(baseColor);
            
            const colors = [
                baseColor,
                hslToHex((hsl.h + 120) % 360, hsl.s, hsl.l),
                hslToHex((hsl.h + 240) % 360, hsl.s, hsl.l),
                hslToHex(hsl.h, hsl.s * 0.6, hsl.l * 1.3),
                hslToHex((hsl.h + 60) % 360, hsl.s * 0.8, hsl.l * 0.8)
            ];
            
            displayPalette(colors);
        }

        function generateAnalogous() {
            const baseColor = generateRandomColor();
            const hsl = hexToHsl(baseColor);
            
            const colors = [
                hslToHex((hsl.h - 30 + 360) % 360, hsl.s, hsl.l),
                hslToHex((hsl.h - 15 + 360) % 360, hsl.s, hsl.l),
                baseColor,
                hslToHex((hsl.h + 15) % 360, hsl.s, hsl.l),
                hslToHex((hsl.h + 30) % 360, hsl.s, hsl.l)
            ];
            
            displayPalette(colors);
        }

        function displayPalette(colors) {
            currentPalette = colors;
            const paletteContainer = document.getElementById('palette');
            paletteContainer.innerHTML = '';

            colors.forEach((color, index) => {
                const colorCard = document.createElement('div');
                colorCard.className = 'color-card';
                colorCard.innerHTML = `
                    <div class="color-preview" style="background-color: ${color}"></div>
                    <div class="color-info">
                        <div class="color-hex">${color.toUpperCase()}</div>
                        <div class="color-copy" id="copy-${index}">Click to copy</div>
                    </div>
                `;
                
                colorCard.addEventListener('click', () => copyToClipboard(color, index));
                paletteContainer.appendChild(colorCard);
            });
        }

        function copyToClipboard(color, index) {
            navigator.clipboard.writeText(color).then(() => {
                const copyText = document.getElementById(`copy-${index}`);
                copyText.textContent = 'Copied!';
                copyText.classList.add('copied');
                
                setTimeout(() => {
                    copyText.textContent = 'Click to copy';
                    copyText.classList.remove('copied');
                }, 2000);
            });
        }

        function hexToHsl(hex) {
            const r = parseInt(hex.slice(1, 3), 16) / 255;
            const g = parseInt(hex.slice(3, 5), 16) / 255;
            const b = parseInt(hex.slice(5, 7), 16) / 255;

            const max = Math.max(r, g, b);
            const min = Math.min(r, g, b);
            let h, s, l = (max + min) / 2;

            if (max === min) {
                h = s = 0;
            } else {
                const d = max - min;
                s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
                switch (max) {
                    case r: h = (g - b) / d + (g < b ? 6 : 0); break;
                    case g: h = (b - r) / d + 2; break;
                    case b: h = (r - g) / d + 4; break;
                }
                h /= 6;
            }

            return { h: h * 360, s, l };
        }

        function hslToHex(h, s, l) {
            h /= 360;
            const a = s * Math.min(l, 1 - l);
            const f = n => {
                const k = (n + h * 12) % 12;
                const color = l - a * Math.max(Math.min(k - 3, 9 - k, 1), -1);
                return Math.round(255 * color).toString(16).padStart(2, '0');
            };
            return `#${f(0)}${f(8)}${f(4)}`;
        }

        function exportPalette(format) {
            if (currentPalette.length === 0) {
                alert('Please generate a palette first!');
                return;
            }

            let exportData = '';
            const timestamp = new Date().toISOString().slice(0, 10);

            switch (format) {
                case 'css':
                    exportData = `:root {\n${currentPalette.map((color, i) => `  --color-${i + 1}: ${color};`).join('\n')}\n}`;
                    break;
                case 'json':
                    exportData = JSON.stringify({
                        name: `Palette_${timestamp}`,
                        colors: currentPalette,
                        created: new Date().toISOString()
                    }, null, 2);
                    break;
                case 'adobe':
                    exportData = currentPalette.map(color => color.slice(1)).join('\n');
                    break;
            }

            const blob = new Blob([exportData], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `palette_${timestamp}.${format === 'json' ? 'json' : format === 'adobe' ? 'txt' : 'css'}`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        // Generate initial palette
        generateRandomPalette();
    </script>
</body>
</html>
